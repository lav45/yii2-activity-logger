name: test

on:
  push:
    branches:
      - '**'
    paths:
      - 'src/**'
      - 'test/**'
      - 'migrations/**'
      - '.github/workflows/test.yml'
      - 'composer.json'
      - 'phpunit.xml.dist'

  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'migrations/**'
      - '.github/workflows/test.yml'
      - 'composer.json'
      - 'phpunit.xml.dist'

jobs:
  test:
    name: PHP ${{ matrix.php }}${{ matrix.nightly && ' (nightly)' || '' }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.nightly == true }}
    strategy:
      fail-fast: false
      matrix:
        php:
          - 8.2
          - 8.3
          - 8.4
          - 8.5
          - 8.6
        include:
          # TODO: remove after shivammathur/setup-php and ezyang/htmlpurifier release PHP 8.6 support
          - php: 8.6
            nightly: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install PHP with extensions
        uses: shivammathur/setup-php@v2
        with:
          extensions: intl, pdo, pdo_sqlite, sqlite3
          php-version: ${{ matrix.php }}
          tools: composer:v2

      - name: Install composer with dev dependencies
        run: composer update --optimize-autoloader --classmap-authoritative --prefer-dist --no-progress --no-interaction --ansi

      - name: phpunit test
        run: composer phpunit
