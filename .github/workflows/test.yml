name: test

on:
  push:
    branches:
      - '**'
    paths:
      - 'src/**'
      - 'test/**'
      - 'migrations/**'
      - '.github/workflows/test.yml'
      - 'composer.json'
      - 'phpunit.xml.dist'

  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'migrations/**'
      - '.github/workflows/test.yml'
      - 'composer.json'
      - 'phpunit.xml.dist'

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [8.2, 8.3, 8.4, 8.5, 8.6]
        include:
          # TODO: remove after ezyang/htmlpurifier releases support for PHP 8.6
          - php: 8.6
            composer-flags: --ignore-platform-req=php+

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install PHP with extensions
        uses: shivammathur/setup-php@v2
        with:
          extensions: intl, pdo, pdo_sqlite, sqlite3
          php-version: ${{ matrix.php }}
          tools: composer:v2

      - name: Install composer with dev dependencies
        run: composer update --optimize-autoloader --classmap-authoritative --prefer-dist --no-progress --no-interaction --ansi ${{ matrix.composer-flags }}

      - name: phpunit test
        run: composer phpunit
